server:
  host: '0.0.0.0'
  port: 8000
  basePath: /api
  allowedOrigins:
    - 'http://localhost:5173'

database:
  # driver: sqlite | postgres
  driver: sqlite
  # sqlite: file path. postgres: full DSN, e.g.
  # "host=localhost user=duraflow password=duraflow dbname=duraflow port=5432 sslmode=disable"
  dsn: './data/duraflow.db'

auth:
  # override in production via DURAFLOW_AUTH_JWTSECRET
  jwtSecret: 'dev-only-change-me'
  tokenTTL: 24h

seedAdmin:
  email: admin@duraflow.local
  password: changeme123
  name: Admin
