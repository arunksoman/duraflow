# Load balancer in front of the backend's api copies, for docker-compose.scale.yml. Any copy can
# serve any request — including a run's live event stream — so plain round robin is enough and no
# sticky sessions are needed.

events {}

http {
  # Docker's DNS; re-resolve so copies started or replaced after nginx are picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8000;

    location / {
      set $backend http://backend:8000;
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";

      # Server-Sent Events (GET /api/executions/{id}/watch): stream each message as it is
      # written, and keep idle streams open between the backend's 20s heartbeats.
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
    }

    # CloudEvents ingest is for worker copies only, which reach the api copies directly on the
    # internal network. Keep it off the public entry point.
    location /api/internal/ {
      return 404;
    }
  }
}
