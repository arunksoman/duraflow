# Scaled-out Duraflow: Postgres, two api copies behind nginx, two worker copies.
#
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up --build
#
# Change the replica counts below (or pass --scale backend=N --scale worker=M) to resize; every
# copy is stateless. The app is still reached on http://localhost:5173, the API on
# http://localhost:8000 (now nginx), and the Temporal UI on http://localhost:8233.

x-backend-env: &backend-env
  DURAFLOW_TEMPORAL_ADDRESS: 'temporal:7233'
  DURAFLOW_DATABASE_DRIVER: postgres
  DURAFLOW_DATABASE_DSN: 'postgres://duraflow:duraflow@postgres:5432/duraflow?sslmode=disable'
  # Must be identical on every copy: JWTs issued by one copy are checked by another, and the
  # CloudEvents token is derived from this secret. Dev-only values — change them for real use.
  DURAFLOW_AUTH_JWTSECRET: 'dev-only-change-me'
  DURAFLOW_SEEDADMIN_EMAIL: 'admin@duraflow.local'
  DURAFLOW_SEEDADMIN_PASSWORD: 'changeme123'
  DURAFLOW_SEEDADMIN_NAME: 'Admin'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: duraflow
      POSTGRES_PASSWORD: duraflow
      POSTGRES_DB: duraflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U duraflow']
      interval: 2s
      timeout: 2s
      retries: 30

  # The api role: REST, live run streams, CloudEvents ingest, and (on one copy at a time) the
  # completion watchers. Reached through nginx, so it publishes no port of its own.
  backend:
    ports: !reset []
    volumes: !reset []
    environment:
      <<: *backend-env
      DURAFLOW_ROLES: api
    deploy:
      replicas: 2
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # The worker role: executes workflows. Sends task events to the api copies over the internal
  # network (Docker's DNS round-robins "backend" across them).
  worker:
    build: ./backend
    environment:
      <<: *backend-env
      DURAFLOW_ROLES: worker
      DURAFLOW_TELEMETRY_SINKURL: 'http://backend:8000/api/internal/zigflow/events'
    deploy:
      replicas: 2
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '8000:8000'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  frontend:
    environment:
      API_BASE_URL: 'http://nginx:8000/api'
    depends_on: !override
      - nginx

volumes:
  postgres-data:
