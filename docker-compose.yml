services:
  temporal:
    build: ./docker/temporal
    ports:
      - '7233:7233' # gRPC frontend
      - '8233:8233' # web UI
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8233']
      interval: 2s
      timeout: 2s
      retries: 30

  backend:
    build: ./backend
    ports:
      - '8000:8000'
    volumes:
      - ./backend/data:/app/data
    environment:
      DURAFLOW_TEMPORAL_ADDRESS: 'temporal:7233'
    depends_on:
      temporal:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - '5173:5173'
    environment:
      API_BASE_URL: 'http://backend:8000/api'
      PORT: '5173'
      HOST: '0.0.0.0'
    depends_on:
      - backend
