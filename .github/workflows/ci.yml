name: CI

# Pull requests, pushes to main (which is how a PR lands) and merge-queue merges. Pushes to other
# branches are left to the pull_request event: triggering on both ran every PR commit twice, and the
# two runs never cancelled each other since one is grouped by branch and the other by PR number.
# Use "Run workflow" (workflow_dispatch) to test a branch that has no PR yet.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Test
        run: |
          mkdir -p test-results
          go run gotest.tools/gotestsum@v1.13.0 \
            --format testname \
            --junitfile test-results/backend-junit.xml \
            --jsonfile test-results/backend-tests.json \
            -- -race -coverprofile=test-results/coverage.out -covermode=atomic ./...

      - name: Coverage report
        if: ${{ !cancelled() && hashFiles('backend/test-results/coverage.out') != '' }}
        run: |
          go tool cover -html=test-results/coverage.out -o test-results/coverage.html
          go tool cover -func=test-results/coverage.out > test-results/coverage.txt
          {
            echo "### Backend coverage"
            echo
            echo '```'
            grep -E '^total:' test-results/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results/
          if-no-files-found: warn
          retention-days: 14

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: duraflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # The worker pool against a real Temporal dev server, and the scaled-out deployment (two
      # api and two worker copies) against that plus Postgres. See internal/e2e.
      - name: Start Temporal
        run: |
          curl -sSf https://temporal.download/cli.sh | sh -s -- --dir "$HOME/.temporalio"
          "$HOME/.temporalio/bin/temporal" server start-dev --headless --port 7299 --log-level warn &
          for i in $(seq 1 60); do
            if "$HOME/.temporalio/bin/temporal" operator cluster health --address localhost:7299 >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "::error::Temporal never became healthy"; exit 1

      - name: Test
        env:
          DURAFLOW_E2E_TEMPORAL: localhost:7299
          DURAFLOW_TEST_POSTGRES: postgres://postgres:pg@localhost:5432/duraflow?sslmode=disable
        run: go test -count=1 -v ./internal/e2e/ ./internal/coord/

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # src/lib/paraglide is generated (and gitignored). Vite's paraglide plugin writes it during
      # a build or test run, but the type check comes first and imports from it.
      - name: Generate i18n messages
        run: pnpm exec paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      # Component tests run in real Chromium through Vitest's Playwright provider.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Type check
        run: pnpm check

      # Not blocking yet: existing source files still have Prettier/ESLint findings. Drop
      # continue-on-error once `pnpm lint` is clean.
      - name: Lint
        continue-on-error: true
        run: pnpm lint

      - name: Unit and component tests
        run: >
          pnpm test:coverage
          --reporter=default
          --reporter=junit
          --outputFile.junit=test-results/frontend-junit.xml

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('frontend/coverage/index.html') != '' }}
        run: |
          {
            echo "### Frontend coverage"
            echo
            echo "See the \`frontend-test-results\` artifact for the full HTML report."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: |
            frontend/test-results/
            frontend/coverage/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The whole product as users get it: Temporal, the backend (API and worker pool in one
      # process) and the frontend, built from this commit.
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 600

      - name: Wait for the app
        run: |
          for url in http://localhost:8000/openapi.json http://localhost:5173/login; do
            for i in $(seq 1 60); do
              if curl --silent --fail --output /dev/null "$url"; then echo "up: $url"; break; fi
              if [ "$i" = 60 ]; then echo "::error::$url never answered"; exit 1; fi
              sleep 2
            done
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        env:
          CI: 'true'
        run: pnpm test:e2e

      - name: Collect service logs
        if: ${{ !cancelled() }}
        run: |
          mkdir -p frontend/test-results
          docker compose ps --all > frontend/test-results/compose-ps.txt
          docker compose logs --no-color --timestamps > frontend/test-results/compose.log

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop the stack
        if: ${{ always() }}
        run: docker compose down --volumes
